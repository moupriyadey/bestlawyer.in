<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard | Adv. Kanchan Das Website</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light py-4">
  <div class="container" style="max-width: 800px;">
    
    <!-- Auth Card -->
    <div id="auth-panel" class="card shadow p-4 mb-4">
      <h3 class="card-title text-center mb-3">Admin Login</h3>
      <div class="mb-3">
        <label>Username</label>
        <input type="text" id="admin-user" class="form-control" value="admin">
      </div>
      <div class="mb-3">
        <label>Password</label>
        <div class="input-group">
          <input type="password" id="admin-pass" class="form-control">
          <button class="btn btn-outline-secondary" type="button" onclick="togglePass()"><i id="eye-icon" class="fas fa-eye"></i></button>
        </div>
      </div>
      <button class="btn btn-primary w-100" onclick="login()">Access Panel</button>
    </div>

    <!-- Admin Control Panel (Hidden by Default) -->
    <div id="control-panel" class="card shadow p-4 d-none">
      <h3 class="card-title border-bottom pb-2 mb-3">Manage Website Data</h3>
      
      <div class="mb-3">
        <label class="form-label fw-bold">Phone Number</label>
        <input type="text" id="edit-phone" class="form-control">
      </div>
      
      <div class="mb-3">
        <label class="form-label fw-bold">WhatsApp Number (With Country Code, no +)</label>
        <input type="text" id="edit-wa" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Chamber Address</label>
        <textarea id="edit-address" class="form-control" rows="2"></textarea>
      </div>

      <button class="btn btn-success mb-3" onclick="exportData()"><i class="fas fa-download me-2"></i>Export Updated site-data.json</button>
      <div id="export-output" class="d-none">
        <p class="small text-muted">Copy the JSON below and replace the content inside <code>site-data.json</code> in your project folder:</p>
        <textarea id="json-textarea" class="form-control font-monospace" rows="8" readonly></textarea>
      </div>
    </div>

  </div>

  <script>
    function togglePass() {
      const passInput = document.getElementById("admin-pass");
      const icon = document.getElementById("eye-icon");
      if (passInput.type === "password") {
        passInput.type = "text";
        icon.className = "fas fa-eye-slash";
      } else {
        passInput.type = "password";
        icon.className = "fas fa-eye";
      }
    }

    function login() {
      const pass = document.getElementById("admin-pass").value;
      if (pass === "kanchan123") { // Simple protection
        document.getElementById("auth-panel").classList.add("d-none");
        document.getElementById("control-panel").classList.remove("d-none");
        loadAdminFields();
      } else {
        alert("Incorrect credentials");
      }
    }

    let currentJson = {};
    function loadAdminFields() {
      fetch("site-data.json")
        .then(res => res.json())
        .then(data => {
          currentJson = data;
          document.getElementById("edit-phone").value = data.profile.phone;
          document.getElementById("edit-wa").value = data.profile.whatsapp;
          document.getElementById("edit-address").value = data.profile.address;
        });
    }

    function exportData() {
      currentJson.profile.phone = document.getElementById("edit-phone").value;
      currentJson.profile.whatsapp = document.getElementById("edit-wa").value;
      currentJson.profile.address = document.getElementById("edit-address").value;

      const outArea = document.getElementById("json-textarea");
      outArea.value = JSON.stringify(currentJson, null, 2);
      document.getElementById("export-output").classList.remove("d-none");
    }
  </script>
</body>
</html>
